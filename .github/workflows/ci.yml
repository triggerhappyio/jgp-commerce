name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A real Postgres service for the integration tests. This is a
    # throwaway, CI-only database — never the staging/production one — so
    # migrate deploy + the concurrency/idempotency integration tests can
    # actually run here even though they can't in this repo's local dev
    # environment (no Docker available there). Destructive commands are
    # safe here specifically because this database exists for the
    # duration of this job only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jgp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jgp_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/jgp_ci
      AUTH_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma migrate deploy (against the CI-only database)
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm run test

      - name: Production build
        run: npm run build
